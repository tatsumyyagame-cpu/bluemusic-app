<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>BlueMusic</title>
<script src="https://cloudflare.com"></script>
<style>
*{box-sizing:border-box;font-family:sans-serif}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#060b19,#0f1c3f);color:#fff;display:flex;flex-direction:column;align-items:center;padding-bottom:75px}
.header{width:100%;max-width:400px;padding:18px 20px 10px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:700;color:#3a86ff}
.badge{background:#1c2541;color:#60a5fa;font-size:11px;padding:4px 10px;border-radius:12px}
.container{width:100%;max-width:370px;padding:10px 15px}
.tela{display:none}
.tela.ativa{display:block}
.busca-box{display:flex;gap:8px;margin-bottom:15px}
input[type=text]{flex:1;padding:12px 15px;border-radius:25px;border:1px solid #2b3a67;background:#0b132b;color:#fff;outline:0}
.btn-buscar{background:#3a86ff;border:0;color:#fff;padding:0 18px;border-radius:25px;font-weight:700;cursor:pointer}
.aviso-status{text-align:center;font-size:13px;color:#7f9cf5;margin:20px 0}
.card-resultado{background:#0b132b;border:1px solid #1c2541;border-radius:15px;padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.thumb-icon{width:46px;height:46px;background:#1c2541;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.info-res{flex:1;overflow:hidden}
.info-res h4{margin:0 0 4px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info-res span{font-size:11px;color:#8d99ae}
.btn-dl{background:#1c2541;color:#3a86ff;border:1px solid #3a86ff;padding:8px 12px;border-radius:20px;font-size:12px;cursor:pointer;flex-shrink:0}
.player-card{background:#0b132b;border:1px solid #1c2541;padding:20px;border-radius:24px;text-align:center}
.vinil-container{width:175px;height:175px;margin:0 auto 15px;border-radius:50%;background:radial-gradient(circle,#111 40%,#050505 100%);padding:12px;box-shadow:0 8px 25px rgba(0,168,255,.25);position:relative;display:flex;align-items:center;justify-content:center;border:3px solid #1c2541}
.capa-vinil{width:100%;height:100%;border-radius:50%;background:#1c2541;display:flex;align-items:center;justify-content:center;font-size:45px;overflow:hidden}
.capa-vinil img{width:100%;height:100%;object-fit:cover}
.vinil-container::after{content:"";width:22px;height:22px;background:#0b132b;border:3px solid #3a86ff;border-radius:50%;position:absolute}
@keyframes girar{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.girando{animation:girar 6s linear infinite}
.pausado{animation-play-state:paused}
h3{margin:5px 0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
p{margin:0 0 12px;font-size:12px;color:#7f9cf5}
.tempo-box{display:flex;justify-content:space-between;font-size:11px;color:#8d99ae}
input[type=range]{width:100%;accent-color:#3a86ff;margin-bottom:15px}
.controles{display:flex;justify-content:space-between;align-items:center;padding:0 10px;margin-bottom:15px}
.controles button{background:0;border:0;color:#cbd5e1;font-size:20px;cursor:pointer}
.controles button.ativo{color:#3a86ff}
.btn-play{background:linear-gradient(135deg,#3a86ff,#00509d)!important;color:#fff!important;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.btn-abrir{display:inline-block;background:#1c2541;padding:9px 16px;border-radius:20px;font-size:12px;color:#60a5fa;cursor:pointer}
.playlist{max-height:120px;overflow-y:auto;text-align:left;background:#070d1f;border-radius:12px;padding:8px;border:1px solid #1c2541;margin-top:15px}
.item-musica{padding:8px;font-size:12px;border-bottom:1px solid #131c36;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#94a3b8}
.item-musica.tocando{color:#3a86ff;font-weight:700}
.nav-inferior{position:fixed;bottom:0;width:100%;max-width:400px;background:#070d1f;border-top:1px solid #1c2541;display:flex;justify-content:space-around;padding:10px 0}
.nav-btn{background:0;border:0;color:#64748b;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.nav-btn.ativo{color:#3a86ff;font-weight:700}
</style>
</head>
<body>
<div class="header"><div class="logo">🎵 BlueMusic</div><div class="badge">Sem Anúncios</div></div>
<div class="container">
<div id="telaBusca" class="tela ativa">
<div class="busca-box"><input type="text" id="campoBusca" placeholder="Nome da música ou link..."><button class="btn-buscar" id="btnPesquisar">🔍</button></div>
<div id="resultados"><div class="aviso-status">Pesquise o nome da música ou cole o link acima.</div></div>
</div>
<div id="telaPlayer" class="tela">
<div class="player-card">
<div class="vinil-container girando pausado" id="vinil"><div class="capa-vinil" id="capa">🎵</div></div>
<h3 id="titulo">Nenhuma música</h3><p id="artista">Carregue as músicas baixadas</p>
<div class="tempo-box"><span id="tempoAtual">0:00</span><span id="tempoTotal">0:00</span></div>
<input type="range" id="progresso" value="0" min="0" max="100">
<div class="controles">
<button id="btnShuffle">🔀</button><button id="btnVoltar">⏮️</button><button class="btn-play" id="btnPlay">▶️</button><button id="btnAvancar">⏭️</button><button id="btnRepeat">🔁</button>
</div>
<label class="btn-abrir">📂 Selecionar Músicas do Celular<input type="file" id="seletor" accept="audio/*" multiple hidden></label>
<div class="playlist" id="listaPlaylist"><div class="item-musica" style="text-align:center">Sua playlist aparecerá aqui</div></div>
</div>
</div>
</div>
<div class="nav-inferior">
<button class="nav-btn ativo" id="navBusca"><span>⬇️</span><span>Baixar</span></button>
<button class="nav-btn" id="navPlayer"><span>💿</span><span>Meu Player</span></button>
</div>
<audio id="audio"></audio>
<script>
const SERVIDOR_URL="https://bluemusic-servidor.onrender.com";
document.getElementById("navBusca").onclick=function(){document.getElementById("telaBusca").classList.add("ativa");document.getElementById("telaPlayer").classList.remove("ativa");this.classList.add("ativo");document.getElementById("navPlayer").classList.remove("ativo")};
document.getElementById("navPlayer").onclick=function(){document.getElementById("telaPlayer").classList.add("ativa");document.getElementById("telaBusca").classList.remove("ativa");this.classList.add("ativo");document.getElementById("navBusca").classList.remove("ativo")};
document.getElementById("btnPesquisar").onclick=async function(){
const t=document.getElementById("campoBusca").value.trim(),b=document.getElementById("resultados");if(!t)return;
b.innerHTML='<div class="aviso-status">⏳ Buscando... (Aguarde até 30s na primeira vez)</div>';
try{const r=await fetch(SERVIDOR_URL+"/buscar?q="+encodeURIComponent(t)),l=await r.json();
if(!l.length){b.innerHTML='<div class="aviso-status">Nenhum resultado.</div>';return}
b.innerHTML="";l.forEach(function(i){const c=document.createElement("div");c.className="card-resultado";c.innerHTML='<div class="thumb-icon">🎵</div><div class="info-res"><h4>'+i.titulo+'</h4><span>'+i.duracao+' • MP3</span></div>';const d=document.createElement("button");d.className="btn-dl";d.innerText="⬇️ MP3";d.onclick=function(){d.disabled=true;d.innerText="⏳...";window.location.href=SERVIDOR_URL+"/baixar?url="+encodeURIComponent(i.url);setTimeout(function(){d.disabled=false;d.innerText="⬇️ MP3"},6000)};c.appendChild(d);b.appendChild(c)})}catch(e){b.innerHTML='<div class="aviso-status">❌ Erro: '+e.message+'</div>'}};
const audio=document.getElementById("audio"),vinil=document.getElementById("vinil"),capa=document.getElementById("capa"),btnPlay=document.getElementById("btnPlay");let playlist=[],indiceAtual=0,aleatorio=false,repetir=false;
document.getElementById("seletor").onchange=function(e){playlist=Array.from(e.target.files);if(playlist.length>0){indiceAtual=0;carregarMusica(0)}};
function carregarMusica(i){const a=playlist[i];audio.src=URL.createObjectURL(a);document.getElementById("titulo").innerText=a.name.replace(/\.[^/.]+$/,"");document.getElementById("artista").innerText="Faixa "+(i+1)+" de "+playlist.length;capa.innerHTML="🎵";if(window.jsmediatags){window.jsmediatags.read(a,{onSuccess:function(t){if(t.tags.title)document.getElementById("titulo").innerText=t.tags.title;if(t.tags.artist)document.getElementById("artista").innerText=t.tags.artist;if(t.tags.picture){const d=t.tags.picture.data;let b64="";for(let x=0;x<d.length;x++)b64+=String.fromCharCode(d[x]);capa.innerHTML='<img src="data:'+t.tags.picture.format+';base64,'+window.btoa(b64)+'">'}}})}const le=document.getElementById("listaPlaylist");le.innerHTML="";playlist.forEach(function(arq,idx){const div=document.createElement("div");div.className="item-musica"+(idx===i?" tocando":"");div.innerText=(idx+1)+". "+arq.name.replace(/\.[^/.]+$/,"");div.onclick=function(){indiceAtual=idx;carregarMusica(idx)};le.appendChild(div)});audio.play();btnPlay.innerText="⏸️";vinil.classList.remove("pausado")}
btnPlay.onclick=function(){if(!audio.src)return;if(audio.paused){audio.play();btnPlay.innerText="⏸️";vinil.classList.remove("pausado")}else{audio.pause();btnPlay.innerText="▶️";vinil.classList.add("pausado")}};
document.getElementById("btnAvancar").onclick=function(){if(!playlist.length)return;indiceAtual=aleatorio?Math.floor(Math.random()*playlist.length):(indiceAtual+1)%playlist.length;carregarMusica(indiceAtual)};
document.getElementById("btnVoltar").onclick=function(){if(!playlist.length)return;indiceAtual=(indiceAtual-1+playlist.length)%playlist.length;carregarMusica(indiceAtual)};
document.getElementById("btnShuffle").onclick=function(){aleatorio=!aleatorio;this.classList.toggle("ativo",aleatorio)};
document.getElementById("btnRepeat").onclick=function(){repetir=!repetir;this.classList.toggle("ativo",repetir)};
